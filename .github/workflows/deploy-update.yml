name: EAS Update (Preview)

# Publish an OTA update to the "preview" EAS branch every time frontend
# changes land on main. Also runnable on-demand via the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-update.yml'
  workflow_dispatch:

concurrency:
  group: eas-update-preview
  cancel-in-progress: false

jobs:
  update:
    name: eas update --branch preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies (npm, legacy peer deps)
        run: npm install --legacy-peer-deps

      - name: Publish EAS Update to preview branch
        run: eas update --branch preview --auto --non-interactive
