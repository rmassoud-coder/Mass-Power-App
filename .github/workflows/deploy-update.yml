---

Step 2: Delete the Lockfile

Delete these files from your repo:

· frontend/yarn.lock
· frontend/package-lock.json

---

Step 3: Update deploy-update.yml

Add --no-package-lock to the install command:

```yaml
name: Deploy OTA Update
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Expo EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --no-package-lock
      - name: Publish EAS Update
        env:
          EAS_PROJECT_ID: 'da7e8ad1-adbd-4341-9221-78c6702a848f'
        run: |
          cd frontend
          npx eas-cli update --branch preview --platform android --message "Automated update via GitHub Actions" --non-interactive
```

